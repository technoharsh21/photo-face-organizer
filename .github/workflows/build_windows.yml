name: Build Windows & Linux Installers

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools<70 wheel pyinstaller
          pip install -r requirements.txt || pip install PySide6 face_recognition Pillow

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "PhotoFaceOrganizer" app.py

      - name: Install Inno Setup & Build Installer
        shell: powershell
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoFaceOrganizer_Windows_Setup
          path: Output/PhotoFaceOrganizer_Setup.exe
