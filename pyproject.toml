[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-face-organizer"
version = "1.0.0"
description = "Desktop application to automatically detect, recognize, and organize photos by person and group folders."
readme = "README.md"
authors = [{ name = "Harsh", email = "support@technoharsh.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "face_recognition>=1.3.0",
    "Pillow>=9.0.0",
    "numpy>=1.22.0",
    "watchfiles>=0.19.0"
]

[project.scripts]
photo-face-organizer = "app:main"
